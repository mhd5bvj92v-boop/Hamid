<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>
  <text x="410" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ProfiNET Real-Time (RT) frame — as seen in the capture</text>

  <!-- fields -->
  <g font-size="11" text-anchor="middle">
    <rect x="30"  y="70" width="110" height="70" fill="#e8f0fe" stroke="#3b6fd4"/><text x="85"  y="100" font-weight="bold">Dst MAC</text><text x="85" y="118">6 bytes</text>
    <rect x="140" y="70" width="110" height="70" fill="#e8f0fe" stroke="#3b6fd4"/><text x="195" y="100" font-weight="bold">Src MAC</text><text x="195" y="118">6 bytes</text>
    <rect x="250" y="70" width="110" height="70" fill="#fff4e5" stroke="#e08a00"/><text x="305" y="95" font-weight="bold">EtherType</text><text x="305" y="113">0x8892</text><text x="305" y="130" font-size="10">= ProfiNET RT</text>
    <rect x="360" y="70" width="110" height="70" fill="#fde8ef" stroke="#c0398a"/><text x="415" y="95" font-weight="bold">FrameID</text><text x="415" y="113">0x8000</text><text x="415" y="130" font-size="10">= cyclic I/O</text>
    <rect x="470" y="70" width="190" height="70" fill="#e9f7ec" stroke="#2e9e4f"/><text x="565" y="95" font-weight="bold">Process data (I/O)</text><text x="565" y="113">~45 bytes</text><text x="565" y="130" font-size="10">inputs / outputs</text>
    <rect x="660" y="70" width="130" height="70" fill="#f3e8ff" stroke="#7a3bd4"/><text x="725" y="92" font-weight="bold">APDU status</text><text x="725" y="108" font-size="10">cycle counter</text><text x="725" y="122" font-size="10">data status</text><text x="725" y="135" font-size="10">transfer status</text>
  </g>

  <text x="410" y="175" font-size="13" text-anchor="middle" fill="#333">Total ≈ 65 bytes on the wire · sent every ~2 ms in both directions</text>

  <!-- security note -->
  <rect x="120" y="205" width="580" height="70" rx="8" fill="#fff0f0" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#a3281c">No signature · no encryption · no replay protection beyond a weak cycle counter + watchdog</text>
  <text x="410" y="256" font-size="12" text-anchor="middle" fill="#555">→ any host on the segment can read, record, replay or forge these frames</text>
</svg>
