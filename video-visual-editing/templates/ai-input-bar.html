<!doctype html>
<html><head><meta charset="utf-8"><title>AI prompt bar (System A)</title>
<!-- Recreates ONS-034 (warm-to-cool edge glow) and ONS-031 (rainbow AI-mode glow):
     a prompt bar whose glow orbits the border while the prompt types in. -->
<link rel="stylesheet" href="_ui.css">
<style>
  @property --ang { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
  .wrap { position: absolute; transform: translate(-50%, -50%); }
  .glow, .ring { position: absolute; inset: -.25rem; border-radius: 3rem; background: conic-gradient(from var(--ang), var(--g)); }
  .glow { filter: blur(3.2rem); opacity: 1; inset: -1.6rem; }
  .glow2 { position: absolute; inset: -.6rem; border-radius: 3.2rem; background: conic-gradient(from var(--ang), var(--g)); filter: blur(1rem); opacity: .9; }
  .ring { -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: .25rem; }
  .bar { position: relative; border-radius: 2.8rem; background: #0C0D12; padding: 2.2rem 2.4rem 1.6rem; box-shadow: inset 0 .1rem 0 rgba(255,255,255,.06); }
  .prompt { font: 400 2.4rem/1.35 var(--sans); color: var(--ink); min-height: 3.3rem; }
  .prompt.ph { color: var(--ink-3); }
  .caret { display: inline-block; width: .2rem; height: 2.6rem; background: var(--ink); vertical-align: -0.4rem; margin-left: .2rem; }
  .tools { display: flex; gap: 1rem; margin-top: 1.8rem; align-items: center; }
  .chip { font: 500 1.5rem/1 var(--sans); color: var(--ink-2); border: .1rem solid var(--hairline-strong); border-radius: 99rem; padding: .8rem 1.3rem; }
  .send { margin-left: auto; width: 4.4rem; height: 4.4rem; border-radius: 50%; background: linear-gradient(135deg, #8B5CF6, #6366F1); display: grid; place-items: center; }
  .send svg { width: 2rem; fill: #fff; }
</style>
<script src="_runtime.js"></script></head>
<body><div id="stage"></div>
<script>
window.DEFAULT_CONFIG = {
  width: 1080, height: 1920, uiScale: 1.5,
  center: { x: 0.5, y: 0.66 }, barWidth: 0.84,
  palette: 'warm-cool',            // 'warm-cool' (ONS-034) | 'rainbow' (ONS-031) | custom CSS stop list in glowStops
  glowStops: null,
  placeholder: 'Ask anything...',
  prompt: 'Write a 30-day posting plan for a video editor',
  chips: ['Normal', 'DeepThink', 'Voice'],
  inAt: 0.15, typeAt: 0.7, charsPerSec: 26, sendAt: null,
  outAt: 4.2, outDur: 0.3
};
const PAL = { 'warm-cool': '#FF7A3D 0deg, #FF3D6E 60deg, transparent 120deg, transparent 200deg, #3B82F6 260deg, #22D3EE 320deg, #FF7A3D 360deg',
              'rainbow': '#4285F4 0deg, #34A853 90deg, #FBBC05 180deg, #EA4335 270deg, #4285F4 360deg' };
const S = {};
window.setup = (c) => {
  document.documentElement.style.fontSize = (10 * c.width / 1080 * (c.uiScale || 1)) + 'px';
  const w = document.createElement('div'); w.className = 'wrap anim';
  Object.assign(w.style, { left: c.center.x * 100 + '%', top: c.center.y * 100 + '%', width: c.barWidth * 100 + '%' });
  w.style.setProperty('--g', c.glowStops || PAL[c.palette]);
  w.innerHTML = `<div class="glow"></div><div class="glow2"></div><div class="ring"></div><div class="bar"><div class="prompt ph" id="p"></div>
    <div class="tools">${c.chips.map(x => `<span class="chip">${x}</span>`).join('')}<span class="send"><svg viewBox="0 0 24 24"><path d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8l-4.6 4.6L5 11z"/></svg></span></div></div>`;
  document.getElementById('stage').appendChild(w); S.w = w; S.p = w.querySelector('#p'); S.send = w.querySelector('.send');
};
window.duration = (c) => c.outAt + c.outDur + 0.1;
window.renderFrame = (t, c) => {
  const { prog, enter, envelope } = VV;
  const e = envelope(t, c.inAt, 0.4, c.outAt, c.outDur);
  enter(S.w, e, { rise: 20, blur: 8, scale: 0.97 });
  S.w.style.transform = 'translate(-50%, -50%) ' + S.w.style.transform;
  S.w.style.setProperty('--ang', (t * 70) + 'deg');            // glow orbits ~5s per turn
  const n = Math.max(0, Math.floor((t - c.typeAt) * c.charsPerSec));
  const typed = c.prompt.slice(0, n), blink = Math.floor(t * 2) % 2 === 0 || (n > 0 && n < c.prompt.length);
  S.p.className = 'prompt' + (n ? '' : ' ph');
  S.p.innerHTML = (n ? typed : c.placeholder) + (blink && t > c.typeAt - 0.2 ? '<span class="caret"></span>' : '');
  const sendAt = c.sendAt ?? (c.typeAt + c.prompt.length / c.charsPerSec + 0.35);
  const press = prog(t, sendAt, 0.12) * (1 - prog(t, sendAt + 0.12, 0.2));
  S.send.style.transform = `scale(${1 - 0.1 * press})`; S.send.style.boxShadow = `0 0 ${2.4 * press}rem rgba(139,92,246,${.8 * press})`;
};
</script></body></html>
