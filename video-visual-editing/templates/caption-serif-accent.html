<!doctype html>
<html><head><meta charset="utf-8">
<title>Caption: sans + serif accent (System B)</title>
<!-- Recreates the TXT-001..TXT-009 pattern: small sans connector words + one large
     italic-serif key phrase (+ optional tracked line, micro caps, name super). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  html { font-size: 10px; }               /* 1rem = 10px @1080w, rescaled in setup() */
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; width: var(--w); height: var(--h); overflow: hidden; }
  .group { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .group.left { align-items: flex-start; text-align: left; transform: translate(0, -50%); }
  .line { white-space: nowrap; line-height: 0.95; }
  .w { display: inline-block; will-change: transform, opacity, filter; }
  .sans    { font: 600 5.6rem/1 var(--sans); color: var(--text); letter-spacing: -0.01em; text-shadow: 0 0.2rem 1.6rem rgba(0,0,0,.45); }
  .sans-sm { font: 500 4.4rem/1 var(--sans); color: var(--text); letter-spacing: -0.01em; text-shadow: 0 0.2rem 1.4rem rgba(0,0,0,.45); }
  .bold    { font: 800 9rem/0.9 var(--sans); letter-spacing: -0.03em; background: var(--boldFill); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 1.8rem var(--glow)); }
  .serif   { font: italic var(--serifWeight) 16rem/0.84 var(--serif); color: var(--accent); text-shadow: 0 0 3rem var(--glow), 0 0.3rem 1.2rem rgba(0,0,0,.35); letter-spacing: -0.035em; font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
  .serif .w, .script .w { transform-origin: 50% 60%; }
  .condense { display: inline-block; transform: scaleX(var(--condense)); }
  .script  { font: italic 500 10.5rem/0.86 var(--script); color: var(--scriptColor); text-shadow: 0 0 2rem rgba(243,230,196,.25), 0 0.3rem 1.2rem rgba(0,0,0,.35); }
  .tracked { font: 300 3rem/1.2 var(--sans); color: var(--text); opacity: .7; text-transform: uppercase; }
  .micro   { font: 600 2.2rem/1 var(--sans); color: var(--text); text-transform: uppercase; display: flex; justify-content: space-between; align-self: stretch; }
  .gap-tight { margin-top: -0.12em; }
  .serif.gap-tight, .script.gap-tight { margin-top: -0.06em; }
  .serif + .line, .script + .line { margin-top: 0.02em; }
  /* name supers */
  .super { position: absolute; color: #fff; }
  .super .n { font: 500 3.4rem/1.1 var(--sans); letter-spacing: -0.01em; }
  .super .r { font: 400 2.2rem/1.3 var(--sans); opacity: .75; }
  .super.boxed .n { display: inline-block; padding: .4rem 1rem; border: .15rem solid rgba(255,255,255,.85); border-radius: .5rem; }
  .super.highlight .n { display: inline-block; padding: .3rem 1rem; background: #fff; color: #111; border-radius: .3rem; }
  .super.serif .n { font: italic 400 4rem/1 var(--serif); }
  .super .rule { height: .15rem; width: 6rem; background: rgba(255,255,255,.7); margin: .8rem 0; transform-origin: left; }
</style>
<script src="_runtime.js"></script>
</head><body><div id="stage"></div>
<script>
window.DEFAULT_CONFIG = {
  width: 1080, height: 1920,
  anchor: { x: 0.5, y: 0.58 }, align: 'center',
  fonts: { sans: 'Inter', serif: 'Playfair Display', serifWeight: 600, script: 'Playfair Display', condense: 0.9 },
  colors: { text: '#FFFFFF', accent: '#F2A14A', glow: 'rgba(242,161,74,.38)', script: '#F3E6C4',
            boldFill: 'linear-gradient(180deg,#FFF6D8,#F7D774)' },
  // style: sans | sans-sm | serif | script | bold | tracked | micro
  // at: seconds when the line starts; words[] (optional) gives exact per-word times from a transcript
  lines: [
    { text: "What's the", style: 'sans', at: 0.10 },
    { text: '30,000ft', style: 'serif', at: 0.55 },
    { text: 'view on', style: 'sans-sm', at: 1.00 }
  ],
  wordStagger: 0.09,
  outAt: 2.8, outDur: 0.28,
  nameSuper: null   // { name, role, x:0.06, y:0.88, at:0.2, outAt:2.6, style:'plain'|'boxed'|'highlight'|'serif' }
};
let els = [];
window.setup = (c) => {
  document.documentElement.style.fontSize = (10 * c.width / 1080) + 'px';
  const r = document.documentElement.style;
  r.setProperty('--sans', `'${c.fonts.sans}', 'Inter', system-ui, sans-serif`);
  r.setProperty('--serif', `'${c.fonts.serif}', 'Playfair Display', Georgia, serif`);
  r.setProperty('--script', `'${c.fonts.script}', 'Instrument Serif', Georgia, serif`);
  r.setProperty('--serifWeight', c.fonts.serifWeight || 600); r.setProperty('--condense', c.fonts.condense || 1);
  r.setProperty('--text', c.colors.text); r.setProperty('--accent', c.colors.accent);
  r.setProperty('--glow', c.colors.glow); r.setProperty('--scriptColor', c.colors.script);
  r.setProperty('--boldFill', c.colors.boldFill);
  const stage = document.getElementById('stage');
  const g = document.createElement('div');
  g.className = 'group' + (c.align === 'left' ? ' left' : '');
  g.style.left = (c.anchor.x * 100) + '%'; g.style.top = (c.anchor.y * 100) + '%';
  stage.appendChild(g);
  c.lines.forEach((ln, i) => {
    const d = document.createElement('div');
    d.className = `line ${ln.style}` + (i ? ' gap-tight' : '');
    const words = ln.words || (ln.style === 'serif' || ln.style === 'script' || ln.style === 'bold'
      ? [{ w: ln.text, at: ln.at }]      // key phrases land as one unit
      : ln.text.split(' ').map((w, k) => ({ w, at: ln.at + k * c.wordStagger })));
    const host = (ln.style === 'serif' || ln.style === 'script') ? d.appendChild(Object.assign(document.createElement('span'), { className: 'condense' })) : d;
    words.forEach((wd, k) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = wd.w;
      host.appendChild(s);
      if (k < words.length - 1 && ln.style !== 'micro') d.appendChild(document.createTextNode(' '));
      els.push({ el: s, at: wd.at, style: ln.style, line: d });
    });
    g.appendChild(d);
  });
  if (c.nameSuper) {
    const n = c.nameSuper, s = document.createElement('div');
    s.className = 'super ' + (n.style || 'plain');
    s.style.left = ((n.x ?? 0.06) * 100) + '%'; s.style.top = ((n.y ?? 0.88) * 100) + '%';
    s.innerHTML = (n.style === 'serif' ? `<div class="n">${n.name}</div><div class="rule"></div>` : `<div class="n">${n.name}</div>`) + `<div class="r">${n.role || ''}</div>`;
    stage.appendChild(s); window._super = s;
  }
};
window.duration = (c) => Math.max(c.outAt + c.outDur, c.nameSuper ? (c.nameSuper.outAt || 0) + 0.3 : 0) + 0.1;
window.renderFrame = (t, c) => {
  const { prog, lerp, E, clamp } = VV;
  const out = 1 - E.inCubic(clamp((t - c.outAt) / c.outDur));
  for (const it of els) {
    const heavy = it.style === 'serif' || it.style === 'script' || it.style === 'bold';
    const p = prog(t, it.at, heavy ? 0.42 : 0.24, heavy ? 'outQuart' : 'outCubic');
    it.el.style.opacity = p * out;
    const rise = heavy ? 0 : (1 - p) * 12 + (1 - out) * -10;
    const sc = heavy ? lerp(0.92, 1, p) : 1;
    it.el.style.transform = `translateY(${rise}px) scale(${sc})`;
    it.el.style.filter = `blur(${(1 - p) * (heavy ? 10 : 6)}px)`;
    if (it.style === 'tracked') it.line.style.letterSpacing = lerp(0.55, 0.3, p) + 'em';
    if (it.style === 'micro') it.line.style.letterSpacing = lerp(0.3, 0.05, p) + 'em';
  }
  if (window._super) {
    const n = c.nameSuper, s = window._super;
    const p = VV.envelope(t, n.at ?? 0.2, 0.35, n.outAt ?? 2.6, 0.25);
    s.style.opacity = p; s.style.transform = `translateX(${(1 - p) * -14}px)`;
    const rule = s.querySelector('.rule'); if (rule) rule.style.transform = `scaleX(${prog(t, (n.at ?? .2), .4)})`;
  }
};

/* ---- System D: declared sound intents (see references/sound-design.md) ---- */
window.SFX_TRACK = '.w,.super';
window.sfxCues = (c) => {
  const out = [];
  els.forEach((it, i) => {
    const heavy = it.style === 'serif' || it.style === 'script' || it.style === 'bold';
    if (heavy) out.push({ id: 'key-' + i, label: 'key phrase lands: "' + it.el.textContent + '"', kind: 'event', select: '.w', index: i, measure: 'visible', t: it.at,
      category: 'POP', roles: ['pop', 'sci-fi-click', 'ui-click'], priority: 'recommended',
      note: 'Text pops as a whole element -> Pop (Joseph). Place on the first visible frame; -6 to -7 dB. Skip if the line is emotional/quiet - silence is allowed.' });
  });
  if (!out.length) out.push({ id: 'connectors', label: 'connector words only', kind: 'event', t: c.lines[0].at, category: 'POP', roles: [], priority: 'silence-ok', note: 'Small fade-rise words: no sound by default.' });
  if (c.nameSuper) out.push({ id: 'name-super', label: 'name super appears', kind: 'event', select: '.super', index: 0, measure: 'visible', t: c.nameSuper.at ?? 0.2,
    category: 'UI', roles: ['ui-click'], priority: 'optional', note: '14px slide = pop, not a slide: texture, never a whoosh.' });
  out.push({ id: 'exit', label: 'caption exits', kind: 'event', t: c.outAt, category: null, roles: [], priority: 'silence-ok', note: 'Exits stay silent unless they slide far.' });
  return out;
};
</script></body></html>
