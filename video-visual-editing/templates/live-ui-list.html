<!doctype html>
<html><head><meta charset="utf-8"><title>Live UI list (System A)</title>
<!-- Recreates ONS-001 (chips + "You" node + dotted connector) and ONS-003 (inbox
     message cards). Place it in the 55-85% height band beside/over the torso,
     never over the face. Render transparent, composite over footage. -->
<link rel="stylesheet" href="_ui.css">
<style>
  .panel { position: absolute; display: flex; flex-direction: column; gap: 1rem; }
  .head { display: flex; align-items: center; gap: .8rem; margin: 0 0 .2rem .4rem; }
  .row { display: flex; align-items: center; gap: 1.2rem; padding: 1.2rem 1.4rem; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.msg { align-items: flex-start; }
  .dot { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; background: var(--accent); margin-right: .6rem; vertical-align: middle; }
  .node { position: absolute; display: flex; flex-direction: column; align-items: center; gap: .8rem; transform: translate(-50%, -50%); }
  .node .circle { width: 8.4rem; height: 8.4rem; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #3A3B42, #1C1D22);
                  border: .15rem solid var(--hairline-strong); display: grid; place-items: center; box-shadow: var(--shadow); }
  .node .circle svg { width: 4.2rem; height: 4.2rem; fill: #D9DCE3; }
  svg.link { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .active { border-color: rgba(59,130,246,.55); box-shadow: var(--shadow), 0 0 2.4rem rgba(59,130,246,.35); }
</style>
<script src="_runtime.js"></script></head>
<body><div id="stage"><svg class="link" id="link"></svg></div>
<script>
window.DEFAULT_CONFIG = {
  width: 1080, height: 1920,
  variant: 'chips',                 // 'chips' (ONS-001) | 'messages' (ONS-003)
  panel: { x: 0.52, y: 0.60, width: 0.42 },   // left/top of panel as frame fractions, width fraction
  header: null,                     // e.g. { title: 'Inquiries', badge: 2 }
  items: [
    { avatar: 'N', title: 'Northfield Coffee', sub: 'Needs video edits', status: true, at: 0.30 },
    { avatar: 'L', title: 'Loop Agency', sub: 'Needs video edits', at: 0.42 },
    { avatar: 'M', title: 'Maya - Creator', at: 0.54 }
  ],
  node: { label: 'You', x: 0.18, y: 0.68, at: 0.15, linkTo: 0, linkAt: 0.9 },  // null to hide
  activeIndex: 0, activeAt: 1.3,
  uiScale: 1.5,                     // 1.5 matches ONS-001/003 at 1080x1920
  accent: null,                     // e.g. '#FF8A2A' to override the house blue (badge, active row, connector)
  outAt: 3.4, outDur: 0.3
};
const S = {};
window.setup = (c) => {
  document.documentElement.style.fontSize = (10 * c.width / 1080 * (c.uiScale || 1)) + 'px';
  if (c.accent) { const r = document.documentElement.style; r.setProperty('--accent', c.accent); r.setProperty('--accent-2', c.accent); r.setProperty('--accent-glow', c.accentGlow || c.accent + '8C'); }
  const st = document.getElementById('stage');
  const p = document.createElement('div'); p.className = 'panel';
  p.style.left = (c.panel.x * 100) + '%'; p.style.top = (c.panel.y * 100) + '%'; p.style.width = (c.panel.width * 100) + '%';
  if (c.header) {
    const h = document.createElement('div'); h.className = 'head anim';
    h.innerHTML = `<span class="label">${c.header.title}</span>` + (c.header.badge != null ? `<span class="badge">${c.header.badge}</span>` : '');
    p.appendChild(h); S.head = h;
  }
  S.rows = c.items.map((it) => {
    const r = document.createElement('div');
    r.className = 'card row anim' + (c.variant === 'messages' ? ' msg' : '');
    r.innerHTML = `<div class="avatar">${it.avatar || ''}</div><div class="txt"><div class="label">${it.title}</div>` +
      (it.sub ? `<div class="sub">${it.status ? '<span class="dot"></span>' : ''}${it.sub}</div>` : '') + `</div>` +
      (it.meta ? `<div class="meta">${it.meta}</div>` : '');
    p.appendChild(r); return r;
  });
  st.appendChild(p); S.panel = p;
  if (c.node) {
    const n = document.createElement('div'); n.className = 'node anim';
    n.style.left = (c.node.x * 100) + '%'; n.style.top = (c.node.y * 100) + '%';
    n.innerHTML = `<div class="circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.4 3.8-7.4 8.5-7.4s8.5 3 8.5 7.4z"/></svg></div><div class="label">${c.node.label}</div>`;
    st.appendChild(n); S.node = n;
    S.path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    S.path.setAttribute('fill', 'none'); S.path.setAttribute('stroke', 'rgba(200,205,215,.85)');
    S.path.setAttribute('stroke-width', 4 * c.width / 1080 * (c.uiScale || 1)); S.path.setAttribute('stroke-linecap', 'round');
    S.head2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    S.head2.setAttribute('r', 6 * c.width / 1080 * (c.uiScale || 1)); S.head2.setAttribute('fill', '#3B82F6');
    document.getElementById('link').append(S.path, S.head2);
  }
};
window.duration = (c) => c.outAt + c.outDur + 0.1;
window.renderFrame = (t, c) => {
  const { prog, enter, envelope } = VV;
  const out = envelope(t, -1, 0.01, c.outAt, c.outDur);
  if (S.head) enter(S.head, prog(t, (c.items[0].at || 0.3) - 0.12, 0.3) * out);
  S.rows.forEach((r, i) => {
    enter(r, prog(t, c.items[i].at, 0.32) * out, { rise: 18, blur: 6, scale: 0.96 });
    r.classList.toggle('active', c.activeIndex === i && t >= c.activeAt);
  });
  if (S.node) {
    enter(S.node, prog(t, c.node.at, 0.32) * out, { rise: 10, blur: 6, scale: 0.9 });
    // dotted connector from node to target row (measured after layout)
    const target = S.rows[c.node.linkTo ?? 0], nb = S.node.querySelector('.circle').getBoundingClientRect(), tb = target.getBoundingClientRect();
    const x1 = nb.right + 6, y1 = nb.top + nb.height / 2, x2 = tb.left - 6, y2 = tb.top + tb.height / 2;
    const mx = (x1 + x2) / 2;
    S.path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    const L = S.path.getTotalLength(), p = prog(t, c.node.linkAt, 0.6, 'inOutCubic');
    const u = 3 * c.width / 1080 * (c.uiScale || 1);
    // reveal a dotted line progressively: dashes drawn only up to length p*L
    S.path.setAttribute('stroke-dasharray', `${u * 0.01} ${u * 3}`);
    S.path.style.clipPath = '';
    S.path.setAttribute('stroke-dashoffset', 0);
    S.path.style.opacity = out;
    const visible = p * L; S.path.style.strokeDasharray = buildDash(visible, L, u);
    const pt = S.path.getPointAtLength(visible);
    S.head2.setAttribute('cx', pt.x); S.head2.setAttribute('cy', pt.y); S.head2.style.opacity = (p > 0 ? 1 : 0) * out;
  }
};
function buildDash(visible, L, u) {           // dots of length ~0 every 3u up to `visible`, then a gap
  const n = Math.max(0, Math.floor(visible / (u * 3)));
  const parts = []; for (let i = 0; i < n; i++) parts.push(0.01, u * 3);
  parts.push(0.01, L + 10);
  return parts.join(' ');
}

/* ---- System D: declared sound intents ---- */
window.SFX_TRACK = '.head,.row,.node,#link circle';
window.sfxCues = (c) => {
  const out = [];
  if (c.header) out.push({ id: 'header', label: 'header appears', kind: 'event', select: '.head', index: 0, measure: 'visible', t: c.items[0].at - 0.12, category: 'UI', roles: ['ui-click'], priority: 'optional' });
  c.items.forEach((it, i) => out.push({ id: 'row-' + i, label: 'row ' + (i + 1) + ' appears: ' + it.title, kind: 'event', select: '.row', index: i, measure: 'visible', t: it.at,
    category: 'UI', roles: c.items.length > 2 ? ['mechanism-gizmo', 'ui-click'] : ['ui-click'], priority: 'recommended',
    note: 'Multiple assets popping in sequence -> one emphasis per element (Joseph: complex mechanism gizmo / UI click). Keep -7 dB; vary or alternate variations so repeats do not sound robotic.' }));
  if (c.node) {
    out.push({ id: 'node', label: '"' + c.node.label + '" node appears', kind: 'event', select: '.node', index: 0, measure: 'visible', t: c.node.at, category: 'UI', roles: ['ui-click'], priority: 'optional' });
    out.push({ id: 'connector', label: 'connector dot travels to target', kind: 'movement', select: '#link circle', index: 0, measure: 'fastest', t: c.node.linkAt + 0.3,
      category: 'WSH', roles: ['short-whoosh', 'futuristic-whoosh'], priority: 'optional', note: 'Small movement: short whoosh at -12 dB, or leave silent if the rows already carry sound.' });
  }
  if (c.activeIndex >= 0) out.push({ id: 'active', label: 'row becomes active (state change)', kind: 'event', t: c.activeAt, category: 'SCI', roles: ['sci-fi-click'], priority: 'recommended', note: 'Something changes inside the UI -> sci-fi click.' });
  return out;
};
</script></body></html>
