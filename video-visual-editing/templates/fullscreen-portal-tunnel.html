<!doctype html>
<html><head><meta charset="utf-8"><title>Full-screen portal tunnel (System C)</title>
<!-- LIGHT-STREAK family, built from FUL-093 (violet light doorway rising from a floor):
     opaque dark scene, a glowing doorway on a perspective floor, then the camera falls
     through nested doorways that rush past (accelerating). Headline = quiet sans lead-in
     + one italic serif key phrase. Use for "falling into a rabbit hole", "going deeper",
     "entering a new chapter". -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="_ui.css">
<style>
  .scene { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 60%, #0E0A24 0%, #05040D 70%); overflow: hidden; }
  canvas { position: absolute; inset: 0; }
  .head { position: absolute; left: 6%; right: 6%; text-align: center; }
  .lead { font: 600 5.6rem/1 var(--sans); color: #fff; letter-spacing: -0.01em; text-shadow: 0 .2rem 1.6rem rgba(0,0,0,.6); }
  .key  { font: italic 600 16rem/0.9 'Playfair Display', Georgia, serif; color: var(--accent); letter-spacing: -0.035em; margin-top: .4rem;
          text-shadow: 0 0 3rem var(--glow), 0 .3rem 1.2rem rgba(0,0,0,.4); }
</style>
<script src="_runtime.js"></script></head>
<body><div id="stage"><div class="scene" id="scene"><canvas id="cv"></canvas>
  <div class="head" id="head"><div class="lead anim" id="lead"></div><div class="key anim" id="key"></div></div>
</div></div>
<script>
window.DEFAULT_CONFIG = {
  width: 1080, height: 1920,
  rim: '#8B5CF6', core: '#E9DDFF', accent: '#A78BFA', glow: 'rgba(139,92,246,.45)',
  lead: 'stuck in this massive', key: 'rabbit hole',
  vanish: { x: 0.5, y: 0.60 },     // vanishing point (centre of the doorway) as frame fractions
  door: { w: 0.30, h: 0.26 },      // first doorway size as frame fractions
  frames: 9,                       // nested doorways in the tunnel
  revealAt: 0.0, revealDur: 0.7,   // doorway rises out of the floor (FUL-093)
  fallAt: 0.5, fallDur: 2.9,       // camera falls through the doorways (accelerating)
  leadAt: 0.35, keyAt: 1.05,       // headline timing (key phrase lands on its stressed syllable)
  outAt: 3.5, outDur: 0.25
};
const S = {};
window.setup = (c) => {
  document.documentElement.style.fontSize = (10 * c.width / 1080) + 'px';
  const r = document.documentElement.style; r.setProperty('--accent', c.accent); r.setProperty('--glow', c.glow);
  const cv = document.getElementById('cv'); cv.width = c.width; cv.height = c.height; S.g = cv.getContext('2d');
  S.lead = document.getElementById('lead'); S.lead.textContent = c.lead;
  S.key = document.getElementById('key'); S.key.textContent = c.key;
  S.head = document.getElementById('head'); S.head.style.top = (c.height * 0.15) + 'px';
  S.sc = document.getElementById('scene');
};
window.duration = (c) => c.outAt + c.outDur + 0.1;

function doorway(g, cx, cy, w, h, alpha, rim, core) {
  // floor-rooted doorway: open bottom glow + rim on three sides, like FUL-093
  const x = cx - w / 2, y = cy - h / 2, rad = Math.min(w, h) * 0.04;
  g.save(); g.globalAlpha = alpha;
  g.shadowColor = rim; g.shadowBlur = Math.max(6, w * 0.08);
  g.strokeStyle = rim; g.lineWidth = Math.max(1.5, w * 0.012);
  g.beginPath(); g.moveTo(x, y + h); g.lineTo(x, y + rad); g.quadraticCurveTo(x, y, x + rad, y);
  g.lineTo(x + w - rad, y); g.quadraticCurveTo(x + w, y, x + w, y + rad); g.lineTo(x + w, y + h); g.stroke();
  g.shadowBlur = 0;
  const fl = g.createLinearGradient(0, y + h - h * 0.45, 0, y + h);      // light pouring up from the floor
  fl.addColorStop(0, 'rgba(139,92,246,0)'); fl.addColorStop(1, rim);
  g.globalAlpha = alpha * 0.55; g.fillStyle = fl; g.fillRect(x, y + h * 0.55, w, h * 0.45);
  g.globalAlpha = alpha; g.strokeStyle = core; g.lineWidth = Math.max(1, w * 0.006);
  g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + w, y + h); g.stroke();  // hot floor line
  g.restore();
}

window.renderFrame = (t, c) => {
  const { prog, enter, envelope, lerp, E, clamp } = VV, W = c.width, H = c.height, g = S.g;
  g.clearRect(0, 0, W, H);
  const cx = W * c.vanish.x, cy = H * c.vanish.y;
  // perspective floor lines toward the vanishing point
  const reveal = prog(t, c.revealAt, c.revealDur, 'outQuart');
  g.save(); g.globalAlpha = 0.22 * reveal; g.strokeStyle = c.rim; g.lineWidth = 1;
  for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(cx, cy + H * c.door.h / 2); g.lineTo(cx + i * W * 0.18, H); g.stroke(); }
  g.restore();
  // fall: depth phase accelerates (ease-in), so frames rush past faster and faster
  const f = clamp((t - c.fallAt) / c.fallDur), phase = E.inCubic(f) * 3.2;
  const items = [];
  for (let i = 0; i < c.frames; i++) {
    const z = (((i + 1) / c.frames - phase * 0.35) % 1 + 1) % 1 || 1;   // 0 (at the camera) .. 1 (far)
    if (i > 0 && t < c.fallAt) continue;                 // before the fall only the first doorway exists
    items.push(z);
  }
  items.sort((a, b) => b - a).forEach((z) => {
    const s = 0.12 / Math.max(z, 0.02);                  // perspective scale
    const w = W * c.door.w * s, h = H * c.door.h * s;
    const near = clamp((0.12 - z) / 0.1);                // fade as it passes the camera
    const far = clamp((1 - z) / 0.35);                   // fade in from the distance
    const rise = t < c.fallAt + 0.05 ? reveal : 1;
    doorway(g, cx, cy + (1 - rise) * h * 0.5, w, h * rise, far * (1 - near) * reveal, c.rim, c.core);
  });
  // central bloom grows as we fall in
  const bl = g.createRadialGradient(cx, cy, 0, cx, cy, W * lerp(0.25, 0.6, f));
  bl.addColorStop(0, `rgba(167,139,250,${0.35 * reveal + 0.25 * f})`); bl.addColorStop(1, 'rgba(139,92,246,0)');
  g.fillStyle = bl; g.fillRect(0, 0, W, H);
  enter(S.lead, prog(t, c.leadAt, 0.3), { rise: 14, blur: 6 });
  enter(S.key, prog(t, c.keyAt, 0.42, 'outQuart'), { rise: 0, blur: 10, scale: 0.92 });
  S.sc.style.opacity = envelope(t, -1, .01, c.outAt, c.outDur);
};

/* ---- System D: declared sound intents ---- */
window.SFX_TRACK = '.lead,.key';
window.sfxCues = (c) => [
  { id: 'entry', label: 'cut into full-screen scene (frame 0 of this layer)', kind: 'transition', t: 0, category: 'SCI', roles: ['activate-energy', 'sci-fi-impact'], priority: 'recommended',
    note: 'Section change: a riser resolves on this frame with a hit beneath (pass 3). Trim the riser head so it does not swell over the previous words. No music under this scene.' },
  { id: 'fall', label: 'camera falls through the doorways (accelerating)', kind: 'movement', t: c.fallAt + c.fallDur * 0.8, category: 'WSH', roles: ['deep-voice-whoosh', 'hollow-whoosh', 'organic-wind-whoosh'], priority: 'recommended',
    note: 'inCubic: the move is fastest at the END of the fall, so the loudest point sits late. Big move: up to -10 dB.' },
  { id: 'key', label: 'key phrase lands', kind: 'event', select: '.key', index: 0, measure: 'visible', t: c.keyAt, category: 'POP', roles: ['pop', 'sci-fi-click'], priority: 'optional',
    note: 'The whoosh already carries the scene; a pop here is optional.' },
  { id: 'exit', label: 'hard cut back to the speaker', kind: 'transition', t: c.outAt, category: null, roles: [], priority: 'silence-ok' },
];
</script></body></html>
